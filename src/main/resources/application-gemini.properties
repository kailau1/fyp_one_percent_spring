# Google Gemini through its OpenAI-compatible API. Turn on with spring.profiles.active=gemini
# (or SPRING_PROFILES_ACTIVE=gemini) and put your key in your local application.properties:
#   ai.api-key=<key from https://aistudio.google.com/apikey>
# Never commit the key. Model names were checked against the live API (GET .../models) in Nov 2026;
# the 2.5 models had been withdrawn by then.
ai.base-url=https://generativelanguage.googleapis.com/v1beta/openai
# gemini-3.8-flash is the newest, but on the free tier it was often overloaded (HTTP 503 or no reply at all),
# while 3.5 Flash answered feedback in ~8s. If the smart model is busy the app falls back to the fast one.
ai.smart-model=gemini-3.5-flash
ai.fast-model=gemini-3.5-flash-lite
# gemini-embedding-2 at 768 numbers per vector: as accurate as 3072 in our theme tests, at a quarter of the storage
ai.embedding-model=gemini-embedding-2
ai.embedding-dimensions=768
# Thinking counts against max_tokens, and the app's replies are short (60 tokens for a tip), so keep it
# off. Each model only accepts some values: 3.5 Flash takes "none" (or "minimal"), 3.5 Flash-Lite only "minimal".
ai.smart-reasoning-effort=none
ai.fast-reasoning-effort=minimal
