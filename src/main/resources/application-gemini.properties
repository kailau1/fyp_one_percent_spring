# Google Gemini through its OpenAI-compatible API. Turn on with spring.profiles.active=gemini
# (or SPRING_PROFILES_ACTIVE=gemini) and put your key in your local application.properties:
#   ai.api-key=<key from https://aistudio.google.com/apikey>
# Never commit the key.
ai.base-url=https://generativelanguage.googleapis.com/v1beta/openai
ai.smart-model=gemini-2.5-flash
ai.fast-model=gemini-2.5-flash-lite
ai.embedding-model=gemini-embedding-001
# Gemini 2.5 Flash "thinks" before answering, and thinking counts against max_tokens: with the app's
# small limits (60 tokens for a tip) it could think and never answer. Off for these short replies.
ai.reasoning-effort=none
